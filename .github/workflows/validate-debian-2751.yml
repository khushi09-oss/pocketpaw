name: Validate Debian package for PR 2751

on:
  push:
    branches: [test/debian-native-build-2751]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  native-debian:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pr
            ref: 8df42e81a1d07e53ce50998aa31aacb0283f9675
          - label: baseline
            ref: 4d30b0b6d2d6341175a86afa0c3fa25f7f48fdf5
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev reprepro
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: client
        run: bun install
      - name: Record source and tools
        working-directory: client
        env:
          EXPECTED_REF: ${{ matrix.ref }}
        run: |
          git rev-parse HEAD | tee ../source-commit.txt
          test "$(git rev-parse HEAD)" = "$EXPECTED_REF"
          { bun --version; rustc --version; cargo --version; bun run tauri --version; } 2>&1 | tee ../native-tools.txt
      - name: Type check
        working-directory: client
        run: bun run check 2>&1 | tee ../native-check.log
      - name: Build Debian package from source
        working-directory: client
        run: bun run tauri build --bundles deb --ci --no-sign -- --locked 2>&1 | tee ../native-build.log
      - name: Verify metadata and repository import
        if: matrix.label == 'pr'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          package, = Path('client/src-tauri/target/release/bundle/deb').glob('*.deb')
          fields = {'Maintainer': 'PocketPaw Team <hello@pocketpaw.ai>', 'Section': 'utils', 'Homepage': 'https://pocketpaw.xyz/'}
          for key, expected in fields.items():
              actual = subprocess.check_output(['dpkg-deb', '--field', str(package), key], text=True).strip()
              assert actual == expected, (key, actual)
          description = subprocess.check_output(['dpkg-deb', '--field', str(package), 'Description'], text=True)
          assert description.startswith('Desktop client for the PocketPaw AI assistant\n ')
          assert '(none)' not in description
          assert 'Connect to a PocketPaw backend' in description
          control = subprocess.check_output(['dpkg-deb', '--field', str(package)], text=True)
          Path('native-control.txt').write_text(control)
          print(control)
          PY
          mkdir -p /tmp/debian-validation/conf
          printf 'Codename: validation\nComponents: main\nArchitectures: amd64\n' > /tmp/debian-validation/conf/distributions
          reprepro -b /tmp/debian-validation includedeb validation client/src-tauri/target/release/bundle/deb/*.deb 2>&1 | tee native-reprepro.log
          sha256sum client/src-tauri/target/release/bundle/deb/*.deb | tee native-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-debian-validation-2751-${{ matrix.label }}
          retention-days: 7
          path: |
            source-commit.txt
            native-*.txt
            native-*.log
            client/src-tauri/target/release/bundle/deb/*.deb
